[package]
name = "wwama"
version = "0.2.3"
edition = "2024"
description = "Rust wrapper crate for llama.cpp with native, wasm32, and wasm64 builds."
readme = "README.md"
license = "Apache-2.0"
build = "build.rs"
links = "llama"
exclude = ["PLAN.md", "PROGRESS.md"]

[dependencies]
libm = "0.2"

[build-dependencies]
cc = "1.2"
cmake = "0.1.58"

[features]
default = ["webgpu"]
std = []
webgpu = []
cuda = []
vulkan = []
