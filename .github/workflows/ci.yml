name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out wwama
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check out llama.cpp
        shell: bash
        run: git clone --depth 1 https://github.com/ggml-org/llama.cpp.git "$RUNNER_TEMP/llama.cpp"

      - name: Check formatting
        run: cargo fmt --check

      - name: Run tests
        env:
          WWAMA_LLAMA_CPP_DIR: ${{ runner.temp }}/llama.cpp
        run: cargo test --locked
